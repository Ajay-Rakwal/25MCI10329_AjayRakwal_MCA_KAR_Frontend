<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smartly</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body { background-color: #f7bfb1; font-family: Georgia, serif; }
    h2 { font-size: 1.6rem; font-weight: bold; }
    .form-control, .form-select { border-radius: 3px; font-size: 0.9rem; }
    .btn { border-radius: 3px; font-size: 0.85rem; }
    .done { text-decoration: line-through; color: #999; }
    .overdue { border-left: 5px solid red; }
    .card { border-radius: 4px; border: 1px solid #ccc; box-shadow: none; }
    .badge { border-radius: 3px; font-weight: normal; font-size: 0.75rem; }
    .filter-btns .btn { padding: 4px 12px; }
    #processing { font-size: 0.85rem; font-style: italic; }
  </style>
</head>
<body>
<div class="container mt-5" style="max-width: 720px;">
  <h2 class="mb-1">Smartly</h2>
  <hr style="border-top: 2px solid #9b8ec4; margin-bottom: 20px;">

  <div class="row g-2 mb-4">
    <div class="col-5"><input type="text" id="task-input" class="form-control" placeholder="Task name"/></div>
    <div class="col-2"><select id="priority" class="form-select"><option>Low</option><option>Medium</option><option>High</option></select></div>
    <div class="col-3"><input type="date" id="deadline" class="form-control"/></div>
    <div class="col-2"><button class="btn btn-primary w-100" onclick="addTask()">Add</button></div>
  </div>

  <div class="filter-btns mb-1 d-flex gap-2">
    <button class="btn btn-outline-secondary btn-sm" onclick="setFilter('all')">All</button>
    <button class="btn btn-outline-secondary btn-sm" onclick="setFilter('completed')">Completed</button>
    <button class="btn btn-outline-secondary btn-sm" onclick="setFilter('pending')">Pending</button>
    <button class="btn btn-outline-dark btn-sm ms-3" onclick="setSort('priority')">↑ Priority</button>
    <button class="btn btn-outline-dark btn-sm" onclick="setSort('deadline')">↑ Deadline</button>
  </div>

  <p id="processing" style="display:none;" class="text-muted mt-1">Processing...</p>

  <p class="mt-2 mb-3" style="font-size:0.85rem;">
    Total: <b id="total">0</b> &nbsp;|&nbsp; Completed: <b id="comp">0</b> &nbsp;|&nbsp; Pending: <b id="pend">0</b>
  </p>

  <div id="task-list"></div>
</div>

<script>
  let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
  let filter = 'all';
  let sort = null;

  function saveTasks() {
    localStorage.setItem('tasks', JSON.stringify(tasks));
  }

  function addTask() {
    const title = document.getElementById('task-input').value.trim();
    if (!title) { alert('Enter a task name'); return; }
    tasks.push({
      id: Date.now(),
      title,
      priority: document.getElementById('priority').value,
      deadline: document.getElementById('deadline').value,
      completed: false
    });
    saveTasks();
    document.getElementById('task-input').value = '';
    document.getElementById('deadline').value = '';
    render();
  }

  function toggleDone(id) {
    tasks = tasks.map(t => t.id === id ? {...t, completed: !t.completed} : t);
    saveTasks(); render();
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    saveTasks(); render();
  }

  function setFilter(f) {
    filter = f;
    document.getElementById('processing').style.display = 'block';
    debounceRender();
  }

  function setSort(s) { sort = s; render(); }

  function debounce(fn, delay) {
    let t;
    return function() { clearTimeout(t); t = setTimeout(fn, delay); };
  }
  const debounceRender = debounce(render, 300);

  function isOverdue(d) {
    if (!d) return false;
    return d < new Date().toISOString().split('T')[0];
  }

  function render() {
    document.getElementById('processing').style.display = 'none';

    let list = [...tasks];
    if (filter === 'completed') list = list.filter(t => t.completed);
    if (filter === 'pending') list = list.filter(t => !t.completed);

    if (sort === 'priority') {
      const order = {High:1, Medium:2, Low:3};
      list.sort((a,b) => order[a.priority] - order[b.priority]);
    }
    if (sort === 'deadline') {
      list.sort((a,b) => {
        if (!a.deadline) return 1;
        if (!b.deadline) return -1;
        return a.deadline.localeCompare(b.deadline);
      });
    }

    const total = tasks.length;
    const comp = tasks.filter(t => t.completed).length;
    document.getElementById('total').textContent = total;
    document.getElementById('comp').textContent = comp;
    document.getElementById('pend').textContent = total - comp;

    const container = document.getElementById('task-list');
    if (!list.length) { container.innerHTML = '<p style="font-size:0.9rem;color:#999;">No tasks here.</p>'; return; }

    container.innerHTML = list.map(t => {
      const badge = t.priority === 'High' ? 'bg-danger' : t.priority === 'Medium' ? 'bg-warning text-dark' : 'bg-success';
      const overdue = !t.completed && isOverdue(t.deadline) ? 'overdue' : '';
      return `
        <div class="card mb-2 px-3 py-2 ${overdue}">
          <div class="d-flex justify-content-between align-items-center">
            <span class="${t.completed ? 'done' : ''}">${t.title} &nbsp;<span class="badge ${badge}">${t.priority}</span>&nbsp;${t.deadline ? '<small class="text-muted">'+t.deadline+'</small>' : ''}</span>
            <span class="d-flex gap-1">
              <button class="btn btn-sm btn-success" onclick="toggleDone(${t.id})">${t.completed ? 'Undo' : 'Done'}</button>
              <button class="btn btn-sm btn-danger" onclick="deleteTask(${t.id})">Delete</button>
            </span>
          </div>
        </div>`;
    }).join('');
  }

  render();
</script>
</body>
</html>
